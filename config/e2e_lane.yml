# THE BROWSER LANE'S CONTRACT — what the green `playwright` check actually covers.
#
# ONE file, read by BOTH halves of the guard, so there is exactly ONE number to move:
#
#   · bin/e2e-executed-set-check        THE RUNTIME GATE. Reads Playwright's OWN report
#                                       after the lane runs and asserts the set it
#                                       EXECUTED matches this contract.
#   · test/lib/e2e_lane_contract_test.rb THE STATIC GUARD. Reads the committed specs and
#                                       config and asserts they DECLARE this contract,
#                                       and that nothing in the lane can narrow the set.
#
# THE PROPERTY, AND WHY IT IS ASSERTED AT RUNTIME.
# Static counting answers "how many specs are DECLARED". It cannot answer "how many
# specs RAN" — different questions, and the gap between them is where every escape
# hatch lives. A runtime skip is invisible to a source reader BY CONSTRUCTION:
#
#     test("the header does not move", async ({ page }, testInfo) => {
#       testInfo.skip();          // exit 0, "1 skipped", every static guard green
#
# and so is a `--grep` added to the CI command, and so is `--only-changed`, and so is
# a spec whose file never got collected. Each is a different SPELLING of the same
# event: a spec left the executed set. Enumerating spellings is how the hub's version
# of this guard was defeated three times. So the gate reads the RECEIPT, where all of
# them show up as the same arithmetic failure:
#
#     executed == total_specs
#
# TO CHANGE THESE NUMBERS you must edit this file, which is a visible, reviewable diff
# line with a comment attached. That is the point: the hole cannot grow silently.
#
# THIS LANE HAS NO QUARANTINE, AND THAT IS A DECISION.
# The hub's contract carries `quarantined`, a `quarantine_tag`, a `--grep-invert`, and
# an origin/release-baselined ratchet to stop a branch raising its own ceiling. Every
# bit of that is machinery for 18 specs that had already rotted when its lane was
# switched on. This lane starts with none: each spec below was written against code
# that is green today, and each was verified to go RED against its own defect
# reintroduced (see docs/E2E_LANE.md for the traces).
#
# Shipping the quarantine anyway would hand a lane with nothing to exclude a
# documented, tested, reviewed way to exclude things — and the first inconvenient
# spec would find it. There is deliberately no third option here: a spec that cannot
# be fixed gets DELETED, with both numbers below lowered in the same commit, which is
# a diff a reviewer reads as exactly what it is.
---
# Every `test(...)` committed under e2e/. Verified against Playwright's own model,
# not prose:
#   npx playwright test --list   ->  48 tests in 7 files
#
# 5 -> 7: e2e/email_banner_frames.spec.js. The email manager shows a fluid artwork
# frame beside the email's own FIXED 600px banner table; measured side by side they
# were 467x156 and 467x202, with the banner clipped to the column on top of that.
# The relationship between two laid-out boxes is not observable from markup — every
# string assertion on that page passed the whole time it was wrong — so it is
# asserted in a browser, across three widths, and both specs were verified to go RED
# against the defect reintroduced.
#
# 7 -> 16: e2e/email_banner_editor.spec.js. The manager repaints the banner as the
# operator types and disables Save until something changes; both exist only after a
# browser has run the component, and a markup test asserting the x-model/:disabled
# attributes stays green while the component throws on init or paints the wrong
# node. Verified RED against three reintroduced defects: an inert paint() fails 6,
# an always-dirty button fails 2, and dropping the name-free fallback (which ships
# "Welcome !" to anyone with no name on file) fails 2.
#
# 16 -> 19: the same file grew three. The page collapsed three per-card Save
# buttons into one in the header, moved the tint in beside the text it makes
# legible, and replaced the recipient <select> with a listbox that shows avatars
# (a native option cannot carry an image). All three are browser-only: whether a
# button is visible-but-disabled after an edit is undone, whether dragging the
# tint repaints the wash, and whether an avatar renders for an account that has
# none.
#
# 19 -> 22: the manager grew Body, Call-to-action and Footer cards. The dimming of
# the button's fields when the button is switched off is a COMPUTED STYLE — the
# one shape of this a String assertion cannot fake — and removing that binding
# fails 1. The other two cover an untouched page not offering to save, and an
# edited body offering to; both are cheap and both exercise the component.
#
# Worth recording: a fourth was written for a boolean-normalisation guard in the
# dirty check, and the mutation run showed removing the normalisation changed
# nothing. The normalisation was deleted rather than kept with a test that could
# not fail.
#
# 22 -> 30: e2e/profile_chrome.spec.js. /profile split into a read page and an edit
# page, and the split added the two most browser-only things in the engine so far —
# an IntersectionObserver that swaps the identity card for a compact header on
# scroll, and an Alpine dirty check that raises a fixed save bar. Both are in the
# document on EVERY render, hidden by a computed value, so the server's bytes are
# identical whether either program works. Each spec was verified RED against its own
# defect reintroduced, with the lab server restarted between runs (a reused
# RAILS_ENV=test server caches templates and silently reports the PREVIOUS
# mutation's result — that contaminated the first matrix run):
#
#   observer never decides "gone"  -> 3 red   observer pinned "gone"        -> 1 red
#   bar spans the viewport         -> 1 red   dirty check stops trimming    -> 1 red
#   Discard keeps the edit         -> 1 red   save bar absolute not fixed   -> 1 red
#   dirty is always true           -> 3 red
#
# TWO SPECS WERE REWRITTEN AND ONE DELETED because the mutation run caught them
# passing for free, and both failures are the same shape — a negative asserted about
# a state the page was ALREADY in. `toBeHidden()` right after typing is satisfied by
# the first poll, before Alpine has reacted; polling for the compact header's
# opacity at load is satisfied by the initial CSS, before the observer's first
# callback. The two that survive now dirty the form (or scroll the page) FIRST, so
# they assert a TRANSITION, which no poll can win a race against. The third made the
# same claim as an existing transition spec and was deleted rather than kept.
#
# 30 -> 35: e2e/profile_newsletter.spec.js. The newsletter row's Unsubscribe opens
# a confirmation, and the read page grew a modal host to open it from — wiring that
# was new, so "the @click attribute is present" is exactly the evidence that would
# not have caught getting it wrong.
#
# IT CAUGHT A BUG ALREADY SHIPPED IN 0.51.0. studio/modals/_scoped_host declares no
# x-data of its own, and Alpine 3 only initialises trees rooted at one — so a host
# rendered outside any Alpine scope is INERT. The store registers, open() pushes
# onto the stack, current() returns the right modal id, and no dialog reaches the
# document. /profile/edit had the identical shape, so its avatar cropper could not
# open. Both pages now wrap the host in `<div x-data>`; removing that wrapper
# reddens 3 of these 5.
#
# 35 -> 44: e2e/profile_edit_controls.spec.js. The edit page's avatar became the
# photo control (the 28px badge is gone) and its birthday became a calendar. Both
# are hidden-by-computed-value, so the markup is identical whether they work.
# Eight mutations, each verified red with the lab server restarted between runs:
#
#   card-hover rule dropped        -> 1 red   focus reveal dropped          -> 1 red
#   overlay hidden by display:none -> 1 red   click no longer reaches picker-> 1 red
#   popover absolute not fixed     -> 1 red   picker skips the dirty check  -> 1 red
#   future dates selectable        -> 1 red   the badge comes back          -> 4 red
#
# THREE OF THESE FIRST PASSED AGAINST THEIR OWN MUTATION, and each failure is
# worth keeping written down:
#
#   · Hovering the card landed ON the avatar — it is centred, so `.hover()` fired
#     the avatar rule and the CARD rule was never exercised. The spec now hovers
#     a corner, which is the only reason it can fail.
#   · `display: none` computes an opacity of 1 under a hover rule, so an
#     opacity-only assertion passed over a label that rendered nothing. The spec
#     now also demands a box.
#   · `fixed` and `absolute` are INDISTINGUISHABLE at scroll 0. The clipping spec
#     was green against the swap; a second spec scrolls first, which is where
#     viewport coordinates and document coordinates actually diverge.
# 44 -> 47: the operator's bug report on the edit controls. Three specs, and the
# first two exist because THIS LANE WAS STRUCTURALLY BLIND to the defect.
#
# The birthday popover shipped using `grid grid-cols-7`. The engine ships a
# PREBUILT bundle, so a Tailwind utility exists in a consuming app only if that
# app's own views already emitted it — and grid-cols-7 is rare enough that none
# had. Measured in mcritchie-studio's compiled bundle: ZERO occurrences. With no
# grid the seven weekday letters stacked into one vertical column and the popover
# grew to the height of the page.
#
# Every spec here passed the whole time, because e2e/tailwind_input.css carries
# `@source "../app/views"` — the lane compiles the ENGINE's views and emits
# utilities no consumer has. The fix is not a better spec, it is to stop
# depending on the utility: the calendar's layout is now owned CSS shipped in the
# partial, which is true in every app. The two specs added on top of that
# (seven columns resolve, the popover fits on screen) go red against the rule
# being removed, which is the most they can honestly claim. docs/E2E_LANE.md
# records the blindness.
#
# The third: clicking the CARD (not only the picture) opens the picker, exactly
# once. Removing the card's handler reddens it; dropping `.stop` from the avatar
# button reddens it too, because the click then bubbles and opens two dialogs.
#
# 47 -> 49: e2e/vendored_alpine.spec.js. Alpine moved from a floating CDN range to a
# file the engine ships, and the unit guard (test/lib/vendored_alpine_test.rb) can only
# read SOURCE: it proves the head names no CDN and that studio/alpine.js is
# precompiled. Neither fact means the bytes the browser receives are a working Alpine.
# A truncated download, the wrong build, and a missing precompile entry all render
# identical HTML and a dead page — which is why dor-check refused the handoff with
# "this diff ADDS browser code and no browser ever saw it run".
#
# The origin is PROVEN rather than asserted: blockOffsiteRequests fulfils every
# non-localhost request with an EMPTY 200, so passing with the network blocked is only
# possible if Alpine arrived from the pipeline. Restoring the CDN tag fails both specs
# (window.Alpine undefined at the 10s wait). The second spec drives a real x-data /
# x-show transition, because a present Alpine that binds nothing is still broken.
#
# WRITING THESE FOUND A DEFECT IN THE LANE ITSELF, which is why the count moves by two
# rather than one. The first mutation run failed only 1 of 2: E2eLabController's
# `javascript_importmap_tags` stand-in served a SECOND Alpine from node_modules
# (`alpinejs: ^3.14.9` — itself a floating range), so the page had a working Alpine
# whether or not the engine delivered one, and BOTH copies were 3.16.1, so even the
# version assertion could not tell them apart. That stand-in existed to compensate for
# the very CDN this change removes. The stand-in, the copy in e2e/boot.rb, and the
# dependency are all deleted, so the lane now OBSERVES the real delivery path instead
# of papering over it. Every pre-existing spec stays green on the engine's own Alpine.
# 49 -> 50: the calendar's FLIP branch, which no earlier spec had ever run.
#
# The lab's birthday field sits near the top with room below, so every placement
# assertion exercised the BELOW branch only. The flip path — used whenever the
# field is near the viewport bottom — shipped untested and was wrong: it placed
# the popover from a hardcoded `estimatedHeight = 340` while the real popover is
# about 245px, so a flipped calendar floated ~95px above its field and jumped on
# every scroll. The operator found it in turf-monster, on the version that had
# just shipped.
#
# "It fits on screen" could not catch it — a popover 95px too high still fits.
# The property that separates right from wrong is that its BOTTOM edge sits
# against the trigger's TOP edge, and the spec asserts the flip actually happened
# first, so it cannot quietly re-test the branch that already worked.
#
# Two mutations, both red on it: restoring the hardcoded estimate, and measuring
# but dropping the $nextTick (offsetHeight is 0 while x-show still hides it).
#
#
# 50 -> 51: the calendar's side must not change after it opens.
#
# place() runs on every scroll and resize, and it also CHOSE the side — so the
# popover snapped between above and below the instant the available space
# crossed the threshold. Measured on turf-monster at 60px scroll steps: ABOVE,
# ABOVE, ABOVE, ABOVE, then below — a 254px jump between two steps, mid-scroll,
# while the reader was looking at it.
#
# NO EXISTING SPEC COULD SEE IT, including the flip spec added one release
# earlier: that one opens and asserts ONCE, so a side that changes LATER is
# invisible to it. The fix that shipped before this corrected WHERE a flip lands;
# it never asked whether the side should be re-decided at all. The new spec opens
# flipped, asserts it opened flipped (or it proves nothing), then scrolls in
# steps and asserts the side is unchanged at each one — because the jump happened
# between steps, not at the extremes.
#
# Mutation: moving the side decision back inside place() reddens it.

# 51 -> 48: the birthday's calendar popover was REPLACED by the engine's shared
# three-select date field — the same one studio/modals/blocks/_age_verify uses —
# so the count went DOWN: NINE specs retired and six replaced them. The nine were
# the seven-column grid, fitting on screen, not being clipped by its card,
# staying anchored through a scroll, flipping above when short of room, keeping
# the side it opened on, opening at all, picking a day, and refusing a future
# date.
#
# EVERY ONE OF THOSE WAS ABOUT POSITIONING, and every one existed because a
# previous version of that positioning had shipped broken — four defects in three
# days. Three selects have no position, no flip, no popover and no scroll
# listener, so those specs have nothing left to assert. Deleting them is the
# honest move rather than keeping green tests against a component that is gone.
#
# What replaced them tests where a SELECT-based field can actually be wrong: the
# day list following the month (30 in April, 29 in a leap February, 28 otherwise),
# clearing a day the new month does not have, refusing to submit a partial date,
# and a year list that stops at this year. Four mutations, each red on the test
# that names it: a flat 1-31 day list, dropping the out-of-range clear, publishing
# an incomplete date, and not writing to the dirty check.

#
# 48 -> 52: the operator's second bug report on the birthday row, and one of the
# four is a spec that had to be REWRITTEN rather than added — which is the part
# worth recording.
#
# `an incomplete date submits no value` asserted that picking a month leaves the
# save bar DOWN. That is the defect, written down as the contract: on an empty
# birthday the page looked completely inert, with no way to tell whether the
# choice had registered. The lane was green for it the entire time. A spec can
# only defend the behaviour it describes, and describing the wrong one buys
# nothing — so the two questions it was conflating are now asked separately
# (submit nothing, notice everything).
#
# Reading the component for that turned up two more, both worse than the report:
#
#   · A STORED birthday could be DESTROYED by an unfinished edit. 31 January,
#     switch to February, the 31st is blanked because it does not exist — and the
#     hidden field then submitted a BLANK, which #birthday_attributes reads as an
#     intentional delete and clears all three columns with. The field now drops
#     its `name` while incomplete, so it submits nothing at all.
#   · Discard cleared the bar but not the SELECTS, which kept the abandoned edit
#     and went on submitting it.
#
# Plus the guard for the fix's own failure mode: publishing the three parts is
# what makes a partial edit visible, and joining three blanks gives "--", which
# does not equal the form's initial "" — so a naive version arrives DIRTY on an
# untouched page. That spec exists because the fix could break the thing it fixes.
#
# The lab grew LabUserWithBirthday for these: the only way to lose a stored
# birthday is to have one, and against the default LabUser (no birthday) the two
# data-loss specs would pass by having nothing to destroy.
#
# 52 -> 55: the save controls left the fixed bottom bar for the identity chrome
# (operator's call, 2026-08-15) — the card's south-east corner while it is on
# screen, the compact bar once it has scrolled away.
#
# TWO SPECS ASSERTED THE OLD DESIGN LITERALLY — `bar.y + bar.height ===
# viewport.height` — so they could not survive it. They were REWRITTEN rather
# than deleted, because the REQUIREMENT survived even though the implementation
# did not: a save control "not dependent on where you are in the scroll
# context". The old design met it by pinning to the viewport bottom; the new one
# meets it by riding a bar already fixed under the nav. The assertion is now the
# requirement itself — still on screen after scrolling — instead of one
# implementation of it, which is what let the rewrite be honest.
#
# The five moved PAGE as well. /lab/profile renders the READ identity, which is
# not editable and now carries no controls at all; /lab/profile_edit is where the
# editable card lives, so it grew a name field to dirty and a 300vh runway so the
# compact bar actually takes over.
#
# The three genuinely new ones cover what moving them INTO a card created:
#
#   · the corner is a fact about two boxes (inside the card, bottom half, right
#     half) that no markup assertion can reach;
#   · the card must not CHANGE HEIGHT when they appear, or the first keystroke
#     shoves every row below it down the page — which is why they are absolute;
#   · Discard must not open the FILE PICKER. The whole editable card is a click
#     target for the photo picker, so a control inside it that lets its click
#     bubble opens a file dialog on its way to doing its own job.
#
# ONE DEFECT THIS ROUND WAS CAUGHT BY MEASURING RATHER THAN BY A SPEC, and it is
# the lane's known blind spot again: `hidden sm:block` on the change count. The
# engine ships a PREBUILT bundle, and `sm:block` occurs in ZERO consumer bundles
# (checked: mcritchie-studio, mcritchie-industries, turf-monster). The count
# would have been hidden at EVERY width in every app while this lane — which
# compiles the engine's own views — stayed green, exactly as it did for the
# calendar's grid-cols-7. Same answer as then: own the rule
# (.studio-save-count), do not depend on the utility.
#
# 55 -> 56: the compact controls must be CLICKABLE, not merely on screen.
# Measuring a bounding box is not the same claim, and the difference was found by
# mutation: with the compact bar left at `pointer-events: none` — correct for as
# long as it held only a picture and a name, fatal once it holds Save and Discard
# — every spec here stayed green while both buttons were visible, focusable, and
# completely dead to the mouse. The new spec clicks one.
#
# 56 -> 59: the operator simplified the controls — "1 unsaved change  Discard"
# became a simple "Discard", and in the card Save changes now sits ON TOP of
# Discard rather than beside it.
#
# The count did not leave the document, only the screen: two buttons appearing is
# the notification for someone who can see them, and the live region is the whole
# of it for someone who cannot. That needed a spec of a shape this lane had not
# used — toBeVisible() cannot express it, because sr-only clips to a 1px box
# rather than removing the element and Playwright calls a 1px box visible. The
# claim is about SIZE, so it is measured.
#
# The two arrangements are measured rather than described for the same reason as
# the corner: DOM order and visual order part company the moment anything
# reverses a flex, so "above" and "beside" are facts about boxes.
#
# `items-end` was rejected on the way: it is absent from mcritchie-industries'
# compiled bundle (measured), so the stacking is owned CSS. `sr-only` was
# ACCEPTED on the same test — present in all three, and already used by
# style/_modal_specimen.
#
# 59 -> 63: two regressions this change introduced that all 59 specs missed, plus
# the reason they missed them. Both were found in review, not here.
#
# THE LANE ONLY EVER RAN AT ONE WIDTH. playwright.config.js declares no viewport,
# so every spec ran at Chromium's default 1280x720 — and the controls-over-text
# overlap measures exactly 0px at 640px and up. At 390px it covered 106px of the
# name and 64px of the email, with elementFromPoint along the email returning the
# Discard button. The corner spec could not tell the two apart: it asserts the gap
# to the card right and bottom edges, which is true at every width, broken ones
# included. The new cases use test.use inside a describe rather than a new
# PROJECT, which would re-run all 59 and double this number.
#
# AND IT HAD NO FOCUS ASSERTIONS AT ALL. The compact bar hides with opacity 0 and
# pointer-events none, neither of which removes an element from the tab order —
# so on an unscrolled dirty page the first two tab stops were an INVISIBLE Discard
# and Save, and Enter destroyed the edits with nothing on screen. This lane had
# already made the identical observation for the MOUSE (the buttons were "visible,
# focusable, and completely dead to the mouse") and fixed only that half.
#
# 63 -> 64: the gap BETWEEN the two stacked buttons is still card surface, so a
# click landing there bubbled to the card and opened the photo picker. Both
# buttons already stopped their own clicks; nothing owned the 8px between them.
# Closed with one .stop on the wrapper, which covers the buttons, the gap, and
# whatever is added there later.
#
# 64 -> 66: the overlap fix closed the measured INSTANCE, not the PROPERTY, and
# review caught it a second time.
#
# The 639px media query was written against phone-width measurements and it did
# close those. But the overlap was never about the viewport — it is about whether
# the CENTRED TEXT is long enough to reach the corner. At 1280px WITH that fix in
# place: a 30-character name lost 27px, a 33-character name 51px, a 64-character
# email 19px, elementFromPoint over the email returning the Discard button.
#
# ALL 64 SPECS STAYED GREEN because the lab fixture is "Pat Studio" /
# "pat@example.com" — short enough to measure exactly 0px at every width there is.
# The phone spec had 10.77px of margin on the name and ZERO on the email: green,
# and one character away from reporting success on a broken page. A fixture that
# cannot express the defect is not coverage.
#
# So the lab grew LabUserWithLongIdentity (33-character double-barrelled name,
# 64-character corporate address — neither extreme, deliberately: a fixture that
# had to be absurd would be arguing the defect does not matter), both overlap
# specs now run against it, and a third asserts the fix's ARITHMETIC holds — the
# text gutter must stay wider than the controls' RENDERED width, so a longer
# button label cannot silently reopen the overlap.
#
# 66 -> 67: the compact bar never got a narrow-width treatment. Its controls are
# not inside .studio-identity-actions, so the in-flow media query missed it and it
# kept the corner arrangement's assumptions in a strip with no room for them: at
# 320px, scrolled and dirty, the name had 13px of clientWidth against 71px of
# content and rendered "P.", the address "p..". The address now yields at that
# width and the name gets the room, since identifying the account is the bar's
# only job.
#
# Measured as clientWidth against scrollWidth, because `truncate` CLIPS: the
# element stays present and visible at every width, so no visibility assertion can
# see the problem.
total_specs: 67

# What the lane MUST execute — asserted against the runner's own report, so no
# source-level spelling on any axis can move it without moving this line. With no
# quarantine this equals total_specs, and test/lib/e2e_lane_contract_test.rb asserts
# that equality rather than letting the two drift into a silent exclusion.
#
# NOTE FOR ANYONE ADDING A BROWSER. Playwright counts one test per spec PER PROJECT.
# Adding a `firefox` project to playwright.config.js does not add specs, but it
# DOUBLES this number. That is the correct behaviour — the lane really would be
# running twice the tests — and the reason it is called out is that the failure reads
# as "5 more than the contract" rather than "you added a browser".
executed: 67

# The shard matrix in .github/workflows/engine-ci.yml. The lane is small enough to run
# unsharded, so this is 1 — which makes the runtime gate assert "exactly one report
# arrived", a real property that catches a webServer that died after the health probe
# or an upload step that wrote nothing.
shards: 1
