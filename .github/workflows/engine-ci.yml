# Engine CI — runs THIS engine's OWN test suite.
#
# Why this exists: `consumer-ci.yml` runs the two CONSUMER app suites against
# this engine commit. Both are valuable, and neither runs the engine's own
# 24-file suite — so before this lane existed, `test/views/component_css_test.rb`,
# `test/integration/component_css_bundle_test.rb`, and
# `test/views/modal_host_store_behavior_test.rb` had NO CI coverage at all. The
# store behavior suite is the only test that executes the modal host's Alpine
# store for real (the source-string suites stay green under a cardClasses
# clobber), so it was the least-covered test with the most teeth.
#
# The suite runs through `bin/release-check`, the same entry point used for a
# local cert and a gem release, so CI and the release gate cannot drift apart.
#
# node is REQUIRED, not optional: the store behavior suite runs the extracted
# store <script> under node with browser stubs, and it now FAILS rather than
# skips when node is absent. `bin/release-check`'s suite guard additionally
# rejects any file that runs zero tests or skips one, so a lane that silently
# stops covering something goes red instead of green.
#
# THREE JOBS, and the second two are the BROWSER LANE (added 2026-08-12):
#
#   engine-suite       the Ruby suite, via bin/release-check
#   playwright         a real Chromium against real engine partials (e2e/)
#   e2e_executed_set   asserts the lane RAN what it claims, from Playwright's receipt
#
# The browser lane is a PARALLEL job rather than a step inside bin/release-check,
# so it adds ~0 to the wall time a PR waits. That decision, its measurements, the
# refused path filter, and what a Chromium-only lane cannot see are all recorded in
# docs/E2E_LANE.md — read that before changing anything below.
#
# The store behavior suite (node with browser stubs) is deliberately KEPT. It is
# fast, it runs in the Ruby lane, and it covers store timing and state that the
# browser lane does not currently drive. The browser lane covers what stubs
# structurally cannot: layout, paint, and whether a script runs at all.

name: Engine CI

on:
  pull_request:
  push:
    # `release` is here because the G3 pre-QA gate READS this lane's verdict for
    # the release SHA and fails closed on anything but green — and a gem release
    # pushes a version + Gemfile.lock commit DIRECTLY onto `release`, which is not
    # a pull_request and was not a build. So the gate polled for a verdict that
    # could never exist: measured on 2026-08-15, `gh run list --branch release`
    # returned ZERO runs in this repo's entire history, and the 0.50.0 release
    # aborted after 1200s of polling with the gem already published.
    #
    # NOT a special case for gems. mcritchie-studio's ci.yml has built
    # [main, release, accepted] all along; this repo simply never followed.
    #
    # `accepted` IS here as of 2026-08-18, and this comment used to argue the
    # opposite. The old argument was: "every commit reaches it through a PR, which
    # the pull_request trigger above already builds, so adding it would run the
    # whole matrix a second time on the identical tree."
    #
    # THAT PREMISE IS FALSE, and the word doing the damage is "identical". A
    # pull_request run builds the PR head merged into the base AS THE BASE STOOD AT
    # THAT MOMENT. Review lands several approved PRs onto `accepted` in sequence, so
    # after PR A merges, PR B's existing green run describes B-on-top-of-base-without-A
    # — a tree that no longer exists. The tree actually sitting on `accepted` is A+B,
    # and no run has ever executed it. That is the same argument that puts `release`
    # here, one rung earlier; it is not a duplicate build, it is the only build.
    #
    # AND THE COST OF BEING WRONG WAS NOT A MISSING BUILD — IT WAS A DISARMED GUARD.
    # `bin/release prepare` refuses to promote a RED `accepted` (refuse_red_accepted!)
    # by reading this repo's verdict for the branch. With no run here that verdict
    # resolved to :none, which deliberately does NOT block — refusing on an absent
    # verdict would wedge the release lane on every race. So the guard passed over
    # studio-engine in every release without ever having been CAPABLE of failing,
    # while its success line named this repo among those it had checked.
    #
    # `release` remains here for its own additional reason: a gem release pushes a
    # version + Gemfile.lock commit DIRECTLY onto it, outside any PR.
    #
    # This is the DECLARED suite workflow for studio-engine (Ci::BranchGate resolves
    # the repo's verdict to the "Engine CI" name), which is why the trigger belongs
    # here specifically. Certified fleet-wide by Release::AcceptedCertification in
    # mcritchie-studio, which refuses a promote naming any repo whose declared suite
    # workflow cannot build this branch.
    #
    # NO `concurrency:` BLOCK — deliberately. A cancelled run's conclusion is
    # `cancelled`, CiStatus folds that as RED, and every reader is SHA-addressed, so a
    # run superseded by the next merge is indistinguishable from a genuine failure and
    # the sweep's own guard would refuse a healthy branch. Back-to-back pushes to
    # `accepted` are NORMAL. mcritchie-studio's ci.yml carries the full argument.
    branches: [main, release, accepted]

jobs:
  engine-suite:
    name: engine suite (bin/release-check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      # Gemfile.lock MUST keep the `x86_64-linux` platform or this step fails
      # with "your bundle only supports platforms [arm64-darwin-*]" — the lock
      # is generated on Apple Silicon, and this is the first lane to run the
      # engine's own bundle on Linux (the consumer lanes bundle in the CONSUMER
      # repo, where the engine is a path gem, so they never needed it).
      # If you regenerate the lock, re-run: bundle lock --add-platform x86_64-linux
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: true

      # Node 20 matches the ecosystem's mise-managed local runtime (v20.20.2),
      # which is what the store behavior harness was written and verified
      # against. Keep this MAJOR in step with `mise install node@20` so a
      # passing local run and a passing CI run mean the same thing.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the engine suite
        run: bin/release-check

  # ================= THE BROWSER LANE =================
  #
  # A SEPARATE JOB, NOT A STEP IN bin/release-check. That is a cost decision, made
  # against measurements rather than taste:
  #
  #   engine-suite                  1m31s wall
  #   playwright (this job)         1m5s wall — ~45s setup (npm ci + chromium
  #                                 download) + ~10s Rails boot and Tailwind
  #                                 compile + ~4s OF SPECS
  #   e2e_executed_set              10s wall
  #
  # (measured on this lane's first CI run, 31586075901 — not estimated.)
  #
  # Run as a step inside bin/release-check those numbers ADD, and every engine PR
  # waits ~2m45s. Run as parallel jobs they do not: the PR waits max(1m31s, 1m5s)
  # = 1m31s, inside the 1m11s–1m30s band this repo already ran in. The lane costs
  # ~1m15s of BILLABLE runner time and ~0s of anyone's attention.
  #
  # Note where the minute goes: the SPECS are 4 seconds. The rest is npm ci and the
  # chromium download. If this ever needs to be cheaper, cache the browser — do not
  # delete specs.
  #
  # WHY NO PATH FILTER, WHEN THE GATE THIS SERVES IS ITSELF A PATH CLASSIFIER.
  # It is a fair question — `paths: ['app/views/**', 'app/assets/**']` would skip
  # this job on a docs-only PR and save the minute. It is refused for two reasons.
  # First, a path-filtered required check reports SKIPPED, not passed, and a skipped
  # required check is the exact shape that let a red gate go quiet in this ecosystem
  # before. Second, the filter would have to be right about which paths can change
  # browser behaviour, and this lane's own history says that inference is hard: the
  # phantom-element defect was introduced by editing a COMMENT. A filter listing
  # app/views would have caught that one, but the general claim — "we can predict
  # from paths whether the browser is affected" — is the claim ClientSurfaceDiff
  # refuses to make about hunks, for the same reason. At 1m5s in parallel, the
  # saving is not worth buying that risk.
  #
  # If the lane ever grows past the engine suite's wall time it becomes the critical
  # path, and THAT is the moment to shard (config/e2e_lane.yml `shards:`) rather than
  # to start filtering.
  playwright:
    name: browser lane (playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # `--with-deps` installs the shared libraries headless chromium needs on a
      # bare ubuntu runner. Without it the browser downloads fine and then fails to
      # launch, which reads as a mysterious lane failure rather than a missing apt
      # package.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # No database service. test/dummy runs sqlite :memory: inside the server
      # process and the lab pages hold no rows — see e2e/boot.rb.
      - name: Run the browser lane
        env:
          RAILS_ENV: test
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-report.json
        run: npx playwright test --reporter=list,json

      # `if: always()`, NOT `if: failure()`. A failing spec still RAN, and the
      # executed-set gate must count it — otherwise a red lane would also look like
      # a lane that executed nothing.
      - name: Upload the executed-set receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: ${{ github.workspace }}/e2e-report.json
          if-no-files-found: error

      - name: Keep the Playwright report from a failed run
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ${{ github.workspace }}/playwright-report
          if-no-files-found: ignore

  # THE VERDICT GATE. The lane above can say its specs PASSED; it cannot say it RAN
  # THEM ALL. This job reads the receipt and asserts the executed set against
  # config/e2e_lane.yml.
  #
  # `if: always()` is LOAD-BEARING and is the only condition this job may carry:
  # on `needs: playwright` alone, a red lane SKIPS this job, and a skipped required
  # check does not report failure — so the gate would go quiet exactly when it
  # matters. test/lib/e2e_lane_contract_test.rb pins that.
  #
  # `bundler-cache: false` because the gate is stdlib-only (json + yaml). It audits
  # the suite, so it must not be breakable by a dependency problem in the thing it
  # audits.
  e2e_executed_set:
    name: browser lane executed-set
    runs-on: ubuntu-latest
    needs: playwright
    if: always()

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: false

      - name: Download the receipt
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-report
          path: e2e-reports
          merge-multiple: true

      - name: Assert the lane executed exactly the specs it claims to
        run: bin/e2e-executed-set-check e2e-reports
