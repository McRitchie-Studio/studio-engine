# Consumer CI — runs the consumer Rails apps' test suites against THIS engine
# commit, so a PR/merge that breaks `mcritchie_studio`, `turf_monster`, or
# `mcritchie_industries` fails here instead of silently after a
# `bundle update studio-engine` on the consumer side.
#
# This workflow covers the CONSUMERS only. The engine's OWN suite runs in the
# sibling `engine-ci.yml` lane (`bin/release-check`) — do not assume a green
# board here means the engine's own tests ran.
#
# Operator setup (one-time, in studio repo Settings → Secrets and variables → Actions):
#   MCRITCHIE_AGENT_APP_ID      — the `mcritchie-agent` GitHub App's numeric id.
#   MCRITCHIE_AGENT_PRIVATE_KEY — that app's private key (the .pem contents).
#   The "Mint consumer checkout token" step exchanges them for a short-lived
#   installation token scoped to the McRitchie-Studio org, so actions/checkout
#   can clone the private consumer repos. Fine-grained PATs died with the
#   2026-07-29 org migration (they cannot call the check-runs API at all), and
#   the classic CONSUMER_REPO_TOKEN PAT retired with them.
#
# How it works:
#   1. Checks out this engine PR/commit into ./studio
#   2. Checks out the consumer repo into ./<consumer>
#   3. Rewrites the consumer's Gemfile `studio-engine` entry to
#      `path: "../studio"`
#      (matches the local engine HEAD, not whatever tag the consumer pinned)
#   4. Installs against the existing consumer lockfile, preserving unrelated
#      dependency pins
#   5. Generates any non-secret test-only env the consumer needs
#   6. Runs the consumer's standard test suite
#
# Add a new consumer: append its repo and local label to the matrix.

name: Consumer CI

on:
  pull_request:
  push:
    # `release` is here because the G3 pre-QA gate READS this lane's verdict for
    # the release SHA and fails closed on anything but green — and a gem release
    # pushes a version + Gemfile.lock commit DIRECTLY onto `release`, which is not
    # a pull_request and was not a build. So the gate polled for a verdict that
    # could never exist: measured on 2026-08-15, `gh run list --branch release`
    # returned ZERO runs in this repo's entire history, and the 0.50.0 release
    # aborted after 1200s of polling with the gem already published.
    #
    # NOT a special case for gems. mcritchie-studio's ci.yml has built
    # [main, release, accepted] all along; this repo simply never followed.
    #
    # `accepted` is deliberately NOT here. Every commit reaches it through a PR,
    # which the pull_request trigger above already builds, so adding it would run
    # the whole matrix a second time on the identical tree. `release` needs it
    # precisely BECAUSE the version commit arrives outside a PR.
    branches: [main, release]

jobs:
  consumer-tests:
    name: ${{ matrix.consumer }} suite vs this engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: mcritchie_studio
            repo: mcritchie-studio
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: false
          - consumer: turf_monster
            repo: turf-monster
            managed_wallet_encryption_key: ci-test-only-managed-wallet-key-not-a-real-secret
            needs_rails_credentials: true
            needs_solana_admin_key: true
            needs_tailwind_build: false
          # Successor to the retired acquisition-studio prototype's lane. The
          # checkout token is minted from the `mcritchie-agent` GitHub App —
          # org-scoped, so it covers ALL private McRitchie-Studio repos, this
          # one included; no per-repo secret needed.
          - consumer: mcritchie_industries
            repo: mcritchie-industries
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: studio

      # UNCONDITIONAL by design: every consumer repo is private under the
      # McRitchie-Studio org, so a failed mint must fail the job loudly here
      # rather than let the checkout limp along on github.token (which cannot
      # see the private consumers anyway).
      - name: Mint consumer checkout token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MCRITCHIE_AGENT_APP_ID }}
          private-key: ${{ secrets.MCRITCHIE_AGENT_PRIVATE_KEY }}
          owner: McRitchie-Studio

      # fetch-depth: 0 IS LOAD-BEARING — do not "optimize" it back to the default.
      # The hub's e2e quarantine ratchet (test/lib/e2e_quarantine_ratchet_test.rb)
      # reads its baseline from `origin/release` inside THIS checkout; the default
      # depth-1 single-ref fetch leaves that ref unresolvable and the ratchet goes
      # red by design. Mirrors the hub's own ci.yml, which documents the same trap.
      - name: Checkout ${{ matrix.consumer }}
        uses: actions/checkout@v4
        with:
          repository: McRitchie-Studio/${{ matrix.repo }}
          path: ${{ matrix.consumer }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips imagemagick postgresql-client

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          working-directory: ${{ matrix.consumer }}

      - name: Point consumer Gemfile at this engine commit
        working-directory: ${{ matrix.consumer }}
        run: |
          # Replace the `gem "studio-engine", ...` line with a local path ref.
          sed -i.bak 's|^gem "studio-engine".*|gem "studio-engine", path: "../studio"|' Gemfile
          grep -q '^gem "studio-engine", path: "../studio"$' Gemfile
          bundle install --jobs 4 --retry 2

      - name: Generate test-only Solana admin key
        if: ${{ matrix.needs_solana_admin_key }}
        working-directory: ${{ matrix.consumer }}
        run: |
          admin_key="$(bundle exec ruby -e 'require "solana_studio"; kp = Solana::Keypair.generate; print Solana::Keypair.encode_base58(kp.to_bytes)')"
          echo "::add-mask::$admin_key"
          printf 'SOLANA_ADMIN_KEY=%s\n' "$admin_key" >> "$GITHUB_ENV"

      - name: Generate test-only Rails credentials
        if: ${{ matrix.needs_rails_credentials }}
        working-directory: ${{ matrix.consumer }}
        run: |
          master_key="$(ruby -e 'require "securerandom"; print SecureRandom.hex(16)')"
          secret_key_base="$(ruby -e 'require "securerandom"; print SecureRandom.hex(64)')"
          echo "::add-mask::$master_key"
          echo "::add-mask::$secret_key_base"
          printf 'RAILS_MASTER_KEY=%s\n' "$master_key" >> "$GITHUB_ENV"
          printf '%s' "$master_key" > config/master.key
          CI_SECRET_KEY_BASE="$secret_key_base" bundle exec ruby -e 'require "active_support/encrypted_file"; require "yaml"; encrypted = ActiveSupport::EncryptedFile.new(content_path: "config/credentials.yml.enc", key_path: "config/master.key", env_key: "RAILS_MASTER_KEY", raise_if_missing_key: true); encrypted.write({ "secret_key_base" => ENV.fetch("CI_SECRET_KEY_BASE") }.to_yaml)'
          bundle exec rails runner 'raise "missing test secret_key_base" if Rails.application.credentials.secret_key_base.blank?'

      # mcritchie_industries' integration tests render engine-contract pages
      # that import the compiled Tailwind stylesheet; without this build every
      # page render 500s ("tailwind.css is not present in the asset pipeline").
      - name: Build Tailwind CSS
        if: ${{ matrix.needs_tailwind_build }}
        working-directory: ${{ matrix.consumer }}
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bundle exec rails tailwindcss:build

      - name: Prepare test DB + run tests
        working-directory: ${{ matrix.consumer }}
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          MANAGED_WALLET_ENCRYPTION_KEY: ${{ matrix.managed_wallet_encryption_key }}
        run: |
          # Install THIS engine's migrations into the consumer before its suite
          # runs, and migrate them in.
          #
          # An engine release that adds a migration is otherwise unshippable. Each
          # consumer asserts "every migration the resolved engine ships has been
          # installed here" (EnginePinContractTest) — a real invariant, because the
          # install is a manual step and an app that skips it boots fine while
          # missing columns the gem writes to. But in THIS lane the engine is a
          # local path checkout that is ahead of every consumer by construction,
          # so the guard fires on a to-do rather than on drift, and it fires in
          # the engine's PR, where no consumer commit can answer it.
          #
          # Installing here keeps the invariant where it belongs — each consumer's
          # OWN CI still runs that guard against its RELEASED gem, which is the
          # question it was written to ask — and makes this lane exercise the
          # install path an adopting app walks.
          #
          # db:migrate rather than db:test:prepare alone: a freshly copied
          # migration is PENDING against the schema-loaded test DB, and Rails
          # refuses to run a suite with pending migrations.
          bundle exec rails studio_engine:install:migrations
          bundle exec rails db:test:prepare
          bundle exec rails db:migrate
          bundle exec rails test
