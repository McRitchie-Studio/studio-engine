# Consumer CI — runs the consumer Rails apps' test suites against THIS engine
# commit, so a PR/merge that breaks `mcritchie_studio`, `turf_monster`, or
# `mcritchie_industries` fails here instead of silently after a
# `bundle update studio-engine` on the consumer side.
#
# This workflow covers the CONSUMERS only. The engine's OWN suite runs in the
# sibling `engine-ci.yml` lane (`bin/release-check`) — do not assume a green
# board here means the engine's own tests ran.
#
# Operator setup (one-time, in studio repo Settings → Secrets and variables → Actions):
#   MCRITCHIE_AGENT_APP_ID      — the `mcritchie-agent` GitHub App's numeric id.
#   MCRITCHIE_AGENT_PRIVATE_KEY — that app's private key (the .pem contents).
#   The "Mint consumer checkout token" step exchanges them for a short-lived
#   installation token scoped to the McRitchie-Studio org, so actions/checkout
#   can clone the private consumer repos. Fine-grained PATs died with the
#   2026-07-29 org migration (they cannot call the check-runs API at all), and
#   the classic CONSUMER_REPO_TOKEN PAT retired with them.
#
# How it works:
#   1. Checks out this engine PR/commit into ./studio
#   2. Checks out the consumer repo into ./<consumer>, at the LADDER RUNG that
#      matches the engine ref under test (release↔release, main↔main, a PR
#      against its own base) — see "Resolve the consumer ref" below
#   3. Rewrites the consumer's Gemfile `studio-engine` entry to
#      `path: "../studio"`
#      (matches the local engine HEAD, not whatever tag the consumer pinned)
#   4. Installs against the existing consumer lockfile, preserving unrelated
#      dependency pins
#   5. Generates any non-secret test-only env the consumer needs
#   6. Runs the consumer's standard test suite
#
# Add a new consumer: append its repo and local label to the matrix.

name: Consumer CI

on:
  pull_request:
  push:
    # `release` is here because the G3 pre-QA gate READS this lane's verdict for
    # the release SHA and fails closed on anything but green — and a gem release
    # pushes a version + Gemfile.lock commit DIRECTLY onto `release`, which is not
    # a pull_request and was not a build. So the gate polled for a verdict that
    # could never exist: measured on 2026-08-15, `gh run list --branch release`
    # returned ZERO runs in this repo's entire history, and the 0.50.0 release
    # aborted after 1200s of polling with the gem already published.
    #
    # NOT a special case for gems. mcritchie-studio's ci.yml has built
    # [main, release, accepted] all along; this repo simply never followed.
    #
    # `accepted` is deliberately NOT here. Every commit reaches it through a PR,
    # which the pull_request trigger above already builds, so adding it would run
    # the whole matrix a second time on the identical tree. `release` needs it
    # precisely BECAUSE the version commit arrives outside a PR.
    branches: [main, release]

jobs:
  consumer-tests:
    name: ${{ matrix.consumer }} suite vs this engine${{ matrix.shard && format('(shard {0}/{1})', matrix.shard, matrix.shards) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # THE HUB LANE IS SHARDED FOUR WAYS. Measured on run 32334594299: this lane was
          # 502s, of which 416s (83%) was `bundle exec rails test` — the hub's own suite,
          # unsharded, run a second time against the engine commit. It was the engine's
          # critical path while engine-ci.yml finished in 2min.
          #
          # It shards now because the hub's tooling (bin/ci-shard, config/rails_lane.yml)
          # reached every rung this lane can check out. Until then the sharded path could not
          # execute at all, and shipping a matrix whose active branch has never run is how a
          # dead path ships. VERIFIED when the rung pairing below landed: bin/ci-shard,
          # bin/rails-executed-set-check and `shards: 4` are all present on the hub's `main`,
          # `release` AND `accepted`, so no reachable pairing lands on a tree that cannot cut.
          #
          # FOUR EXPLICIT ENTRIES rather than a `shard` dimension: this is an `include:`-only
          # matrix, so a second dimension would cross-product onto turf and industries, which
          # have no bin/ci-shard and must keep running whole. GitHub Actions does not support
          # YAML anchors, so the repetition is the honest cost of keeping the other two lanes
          # untouched.
          - consumer: mcritchie_studio
            repo: mcritchie-studio
            shard: 1
            shards: 4
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: false
          - consumer: mcritchie_studio
            repo: mcritchie-studio
            shard: 2
            shards: 4
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: false
          - consumer: mcritchie_studio
            repo: mcritchie-studio
            shard: 3
            shards: 4
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: false
          - consumer: mcritchie_studio
            repo: mcritchie-studio
            shard: 4
            shards: 4
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: false
          - consumer: turf_monster
            repo: turf-monster
            managed_wallet_encryption_key: ci-test-only-managed-wallet-key-not-a-real-secret
            needs_rails_credentials: true
            needs_solana_admin_key: true
            needs_tailwind_build: false
          # Successor to the retired acquisition-studio prototype's lane. The
          # checkout token is minted from the `mcritchie-agent` GitHub App —
          # org-scoped, so it covers ALL private McRitchie-Studio repos, this
          # one included; no per-repo secret needed.
          - consumer: mcritchie_industries
            repo: mcritchie-industries
            managed_wallet_encryption_key: ""
            needs_rails_credentials: false
            needs_solana_admin_key: false
            needs_tailwind_build: true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: studio

      # UNCONDITIONAL by design: every consumer repo is private under the
      # McRitchie-Studio org, so a failed mint must fail the job loudly here
      # rather than let the checkout limp along on github.token (which cannot
      # see the private consumers anyway).
      - name: Mint consumer checkout token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MCRITCHIE_AGENT_APP_ID }}
          private-key: ${{ secrets.MCRITCHIE_AGENT_PRIVATE_KEY }}
          owner: McRitchie-Studio

      # THE CONSUMER IS CHECKED OUT AT THE SAME LADDER RUNG AS THE ENGINE REF UNDER
      # TEST — never at whatever its default branch happens to be.
      #
      # A ref-less checkout takes the consumer's DEFAULT branch, which for every
      # consumer is `main` = the LAST SHIPPED state. This lane then runs that tree's
      # ENTIRE suite, hub-internal guards included — and some of those guards assert
      # things about the hub's own CROSS-BRANCH state, which a stale checkout gets
      # wrong for reasons that have nothing to do with the engine commit on trial.
      #
      # THAT PAIRING DEADLOCKED A RELEASE. On 2026-08-21, against engine release tip
      # 15024aa2 (run 32455620696), two hub guards went red on an engine commit that
      # broke neither of them:
      #
      #   · E2eQuarantineRatchetTest — "Expected 15 to be <= 12". The hub's
      #     config/e2e_lane.yml carries `quarantined: 15` on `main` and `12` on
      #     `release`, and the ratchet baselines off `origin/release` INSIDE this
      #     checkout. So a `main` tree that merely LAGS `release` reads as a ceiling
      #     RISE. It fires on every candidate that REPAIRS a quarantined spec — which
      #     is to say on exactly the commits the ratchet exists to encourage.
      #   · CiTestCommandTest's pin anti-vacuity assert — "Expected [] to not be
      #     empty". Fixed on the hub's `accepted` by d620526f; absent from `main`.
      #
      # Neither red is reachable from the engine side, and the hub's `main` only
      # advances through `bin/release ship` → which needs the candidate assembled →
      # which needs the gem published → which needs THIS lane green. A closed loop,
      # with `studio_engine 0.58.0` sitting unpublished inside it.
      #
      # THE RULE IS THE RUNG. Engine `release` is a release candidate and is tested
      # against the consumer's `release` — they ship together. Engine `main` against
      # the consumer's `main`. A pull request against the consumer branch matching the
      # PR's BASE, because the base is the rung the engine change is joining. Anything
      # off-ladder, or absent from a given consumer, falls back to that consumer's
      # default branch rather than failing the checkout.
      - name: Resolve the consumer ref to pair with this engine ref
        id: consumer-ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ github.base_ref || github.ref_name }}
          CONSUMER_REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail

          # ONLY THE THREE LADDER RUNGS PAIR. An engine PR based on a feature branch
          # takes the consumer's default branch, exactly as this lane always did, and a
          # consumer that happens to carry a same-named branch is NOT a pairing.
          ref=""
          case "${CANDIDATE}" in
            main|release|accepted)
              if gh api "repos/McRitchie-Studio/${CONSUMER_REPO}/branches/${CANDIDATE}" --silent >/dev/null 2>&1; then
                ref="${CANDIDATE}"
              else
                echo "::notice::${CONSUMER_REPO} has no '${CANDIDATE}' branch; pairing with its default branch"
              fi
              ;;
            *)
              echo "::notice::engine ref '${CANDIDATE}' is off-ladder; pairing ${CONSUMER_REPO} with its default branch"
              ;;
          esac

          # An EMPTY ref is actions/checkout's "use the default branch", which is the
          # fallback this lane wants: a consumer missing the rung must not fail hard.
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "engine '${CANDIDATE}' -> ${CONSUMER_REPO} '${ref:-<default branch>}'"

      # fetch-depth: 0 IS LOAD-BEARING — do not "optimize" it back to the default.
      # The hub's e2e quarantine ratchet (test/lib/e2e_quarantine_ratchet_test.rb)
      # reads its baseline from `origin/release` inside THIS checkout; the default
      # depth-1 single-ref fetch leaves that ref unresolvable and the ratchet goes
      # red by design. Mirrors the hub's own ci.yml, which documents the same trap.
      #
      # It works WITH the `ref:` above, not instead of it. Full depth is what makes
      # `origin/release` RESOLVABLE inside the checkout; the paired ref is what makes
      # the comparison against it MEANINGFUL. Drop either and the ratchet is wrong in
      # a different direction — unresolvable, or resolved against a stranger.
      - name: Checkout ${{ matrix.consumer }}
        uses: actions/checkout@v4
        with:
          repository: McRitchie-Studio/${{ matrix.repo }}
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: ${{ matrix.consumer }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Bounded AND retried, because an Ubuntu mirror that stops answering is the
      # single most common way this lane dies. Measured on one PR (2026-08-19):
      # three separate jobs hung here — twice for the full 45-minute job budget
      # before the step bound existed, once for 10 after — while the other
      # consumers passed on the identical commit.
      #
      # Each attempt is bounded on its own (`timeout`), so a HANG is retried
      # rather than waited out; a healthy install takes well under a minute, and
      # the worst case is two bounded attempts inside the step's own 13.
      - name: Install system packages
        timeout-minutes: 13
        run: |
          for attempt in 1 2; do
            if timeout 120 sudo apt-get update && \
               timeout 240 sudo apt-get install --no-install-recommends -y \
                 libpq-dev libvips imagemagick postgresql-client; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or hung; retrying"
            sleep 10
          done
          exit 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          working-directory: ${{ matrix.consumer }}

      - name: Point consumer Gemfile at this engine commit
        working-directory: ${{ matrix.consumer }}
        run: |
          # Replace the `gem "studio-engine", ...` line with a local path ref.
          sed -i.bak 's|^gem "studio-engine".*|gem "studio-engine", path: "../studio"|' Gemfile
          grep -q '^gem "studio-engine", path: "../studio"$' Gemfile
          bundle install --jobs 4 --retry 2

      # THE ONLY PLACE THIS CAN BE CHECKED. Comparing what this engine resolves
      # against what a consumer resolves needs BOTH lockfiles on disk, and only
      # this lane has them — the engine at `studio/`, the consumer beside it.
      # test/lib/consumer_ci_shard_contract_test.rb records the same constraint
      # for its own cross-repo contract: a test in this repo cannot read another
      # repo's tree at test time.
      #
      # It fails ONLY when the ENGINE TRAILS the consumer. A consumer that lags
      # is the consumer's business and never reddens an engine PR; a consumer
      # that bundles no tracked gem (the BASE half — mcritchie_industries) is a
      # skip, not a failure. Direction, rationale and remedy: studio/bin/gem-
      # drift-check, guarded by test/lib/gem_drift_check_test.rb.
      #
      # Runs once per matrix entry, so the four hub shards each repeat it. That
      # is sub-second and stdlib-only; skipping three of them would need a shard
      # condition that could itself go stale.
      - name: Check this engine does not trail ${{ matrix.consumer }}
        run: |
          ruby studio/bin/gem-drift-check studio/Gemfile.lock \
            "${{ matrix.consumer }}=${{ matrix.consumer }}/Gemfile.lock"

      - name: Generate test-only Solana admin key
        if: ${{ matrix.needs_solana_admin_key }}
        working-directory: ${{ matrix.consumer }}
        run: |
          admin_key="$(bundle exec ruby -e 'require "solana_studio"; kp = Solana::Keypair.generate; print Solana::Keypair.encode_base58(kp.to_bytes)')"
          echo "::add-mask::$admin_key"
          printf 'SOLANA_ADMIN_KEY=%s\n' "$admin_key" >> "$GITHUB_ENV"

      - name: Generate test-only Rails credentials
        if: ${{ matrix.needs_rails_credentials }}
        working-directory: ${{ matrix.consumer }}
        run: |
          master_key="$(ruby -e 'require "securerandom"; print SecureRandom.hex(16)')"
          secret_key_base="$(ruby -e 'require "securerandom"; print SecureRandom.hex(64)')"
          echo "::add-mask::$master_key"
          echo "::add-mask::$secret_key_base"
          printf 'RAILS_MASTER_KEY=%s\n' "$master_key" >> "$GITHUB_ENV"
          printf '%s' "$master_key" > config/master.key
          CI_SECRET_KEY_BASE="$secret_key_base" bundle exec ruby -e 'require "active_support/encrypted_file"; require "yaml"; encrypted = ActiveSupport::EncryptedFile.new(content_path: "config/credentials.yml.enc", key_path: "config/master.key", env_key: "RAILS_MASTER_KEY", raise_if_missing_key: true); encrypted.write({ "secret_key_base" => ENV.fetch("CI_SECRET_KEY_BASE") }.to_yaml)'
          bundle exec rails runner 'raise "missing test secret_key_base" if Rails.application.credentials.secret_key_base.blank?'

      # mcritchie_industries' integration tests render engine-contract pages
      # that import the compiled Tailwind stylesheet; without this build every
      # page render 500s ("tailwind.css is not present in the asset pipeline").
      - name: Build Tailwind CSS
        if: ${{ matrix.needs_tailwind_build }}
        working-directory: ${{ matrix.consumer }}
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bundle exec rails tailwindcss:build

      - name: Prepare test DB + run tests
        working-directory: ${{ matrix.consumer }}
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          MANAGED_WALLET_ENCRYPTION_KEY: ${{ matrix.managed_wallet_encryption_key }}
          # The consumer's own minitest plugin writes this; it is INERT when unset, so the
          # unsharded consumers below simply never produce one.
          CI_RECEIPT_OUT: ${{ matrix.shard && format('{0}/rails-report-shard-{1}.json', github.workspace, matrix.shard) || '' }}
          CI_RECEIPT_SHARD: ${{ matrix.shard }}
          CI_RECEIPT_SHARD_TOTAL: ${{ matrix.shards }}
        run: |
          # Install THIS engine's migrations into the consumer before its suite
          # runs, and migrate them in.
          #
          # An engine release that adds a migration is otherwise unshippable. Each
          # consumer asserts "every migration the resolved engine ships has been
          # installed here" (EnginePinContractTest) — a real invariant, because the
          # install is a manual step and an app that skips it boots fine while
          # missing columns the gem writes to. But in THIS lane the engine is a
          # local path checkout that is ahead of every consumer by construction,
          # so the guard fires on a to-do rather than on drift, and it fires in
          # the engine's PR, where no consumer commit can answer it.
          #
          # Installing here keeps the invariant where it belongs — each consumer's
          # OWN CI still runs that guard against its RELEASED gem, which is the
          # question it was written to ask — and makes this lane exercise the
          # install path an adopting app walks.
          #
          # db:migrate rather than db:test:prepare alone: a freshly copied
          # migration is PENDING against the schema-loaded test DB, and Rails
          # refuses to run a suite with pending migrations.
          bundle exec rails studio_engine:install:migrations
          bundle exec rails db:test:prepare
          bundle exec rails db:migrate

          # `--print` RATHER THAN RUNNING bin/ci-shard DIRECTLY, and the reason is the three
          # lines above. bin/ci-shard runs its own `db:test:prepare test:prepare` before the
          # suite, which reloads the test schema — undoing the engine migrations this lane
          # just installed and migrated in, and leaving the suite against a database missing
          # the very columns the new gem writes to. So the lane keeps its own preparation and
          # uses the planner only to decide WHICH FILES this shard owns.
          #
          # THE DEGENERATE CASE FAILS SAFE. If the substitution comes back empty, this is
          # `bundle exec rails test` — the WHOLE suite, not none of it. Sharding normally
          # inverts that (an empty shard exits 0 silently), which is why the hub needed a
          # receipt gate; here the same accident runs more, not less. The receipt below is
          # still emitted and still audited, because "fails safe" is a weaker claim than
          # "the union was verified".
          if [ -x bin/ci-shard ]; then
            # `test:prepare` EXPLICITLY, and this line is the whole reason the first sharded
            # run failed with 84 errors of
            #   ActionView::Template::Error: The asset "tailwind.css" is not present
            #
            # Rails SKIPS its own `test:prepare` hook — the one tailwindcss-rails enhances
            # with `tailwindcss:build`, producing the gitignored app/assets/builds/tailwind.css
            # — whenever an argument to `rails test` looks like a PATH. An ARGLESS
            # `bundle exec rails test`, which is what this lane ran before sharding, fires it
            # for free. That is exactly why nothing here ever had to ask for it, and exactly
            # why sharding broke it: every shard passes paths.
            #
            # bin/ci-shard runs `db:test:prepare test:prepare` itself for this reason, and we
            # deliberately do NOT call it that way here — its db:test:prepare would reload the
            # schema and drop the engine migrations installed above. So the hook is invoked
            # directly: it builds the CSS and touches no database.
            bundle exec rails test:prepare
            bundle exec rails test $(bin/ci-shard --print --shard=${{ matrix.shard }}/${{ matrix.shards }})
          else
            bundle exec rails test
          fi

      # ALWAYS, not `if: failure()`. A FAILING test still RAN — the executed-set gate must
      # see the receipt to count it. `matrix.shard` scopes this to the sharded hub entries;
      # turf and industries run whole and produce no receipt, which is why the gate below
      # expects exactly the hub's shards and not one per matrix entry.
      - name: Upload this shard's executed-set receipt
        if: always() && matrix.shard
        uses: actions/upload-artifact@v4
        with:
          name: rails-report-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/rails-report-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  # THE EXECUTED-SET GATE for the sharded hub lane.
  #
  # The four shards above can prove their tests PASSED; they cannot prove they RAN THEM ALL.
  # In THIS lane an empty shard would fail safe — an empty file list makes `rails test` run
  # the whole suite — but "fails safe" is a weaker claim than "the union was verified", and
  # a mis-packed shard that runs THREE files rather than none is not safe at all. So the
  # receipts are audited the same way the hub audits its own.
  #
  # It runs the CONSUMER's own gate against the CONSUMER's own contract, checked out here:
  # bin/rails-executed-set-check re-derives the expected file set from that tree, so it
  # audits the suite that actually ran rather than anything this repo asserts about it.
  #
  # `if: always()` is LOAD-BEARING and the only condition it may carry: on `needs:` alone a
  # red shard SKIPS this job, and a skipped required check reports no failure — so the one
  # gate that would say "the lane ran fewer files than it claims" goes quiet exactly when it
  # matters.
  hub-executed-set:
    name: mcritchie_studio executed-set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: consumer-tests
    if: always()

    steps:
      - name: Mint consumer checkout token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MCRITCHIE_AGENT_APP_ID }}
          private-key: ${{ secrets.MCRITCHIE_AGENT_PRIVATE_KEY }}
          owner: McRitchie-Studio

      # The gate, its contract and the expected file set all live in the CONSUMER —
      # and bin/rails-executed-set-check RE-DERIVES the expected file set from THIS
      # tree. So this checkout has to stand on the same rung the shards ran on, or the
      # gate audits one branch's receipts against another branch's file list and
      # reports "drift" that is only ever two branches being two branches.
      #
      # Same resolution as the lane above, and byte-identical to it by contract:
      # test/lib/consumer_ci_ref_pairing_test.rb refuses a workflow whose two resolve
      # steps have drifted apart. GitHub Actions has no YAML anchors, so a guarded
      # duplicate is the honest cost.
      - name: Resolve the consumer ref to pair with this engine ref
        id: consumer-ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ github.base_ref || github.ref_name }}
          CONSUMER_REPO: mcritchie-studio
        run: |
          set -euo pipefail

          # ONLY THE THREE LADDER RUNGS PAIR. An engine PR based on a feature branch
          # takes the consumer's default branch, exactly as this lane always did, and a
          # consumer that happens to carry a same-named branch is NOT a pairing.
          ref=""
          case "${CANDIDATE}" in
            main|release|accepted)
              if gh api "repos/McRitchie-Studio/${CONSUMER_REPO}/branches/${CANDIDATE}" --silent >/dev/null 2>&1; then
                ref="${CANDIDATE}"
              else
                echo "::notice::${CONSUMER_REPO} has no '${CANDIDATE}' branch; pairing with its default branch"
              fi
              ;;
            *)
              echo "::notice::engine ref '${CANDIDATE}' is off-ladder; pairing ${CONSUMER_REPO} with its default branch"
              ;;
          esac

          # An EMPTY ref is actions/checkout's "use the default branch", which is the
          # fallback this lane wants: a consumer missing the rung must not fail hard.
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "engine '${CANDIDATE}' -> ${CONSUMER_REPO} '${ref:-<default branch>}'"

      # fetch-depth: 0 IS LOAD-BEARING HERE TOO, for a different reason than the lane
      # above: the step after the receipts download stands this checkout on the commit
      # the SHARDS ran, and that commit is normally an ANCESTOR of the branch tip. A
      # depth-1 fetch does not contain it, and the re-point would silently no-op.
      - name: Checkout mcritchie_studio
        uses: actions/checkout@v4
        with:
          repository: McRitchie-Studio/mcritchie-studio
          ref: ${{ steps.consumer-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: false

      - name: Download every shard's receipt
        uses: actions/download-artifact@v4
        with:
          pattern: rails-report-shard-*
          path: rails-reports
          merge-multiple: true

      # THE RUNG IS NOT ENOUGH — THE COMMIT HAS TO MATCH TOO.
      #
      # The resolve step above pins this job to the same LADDER RUNG the shards ran on.
      # It cannot pin it to the same COMMIT, because a branch name is a moving target and
      # the two jobs read it minutes apart: the shards resolve `accepted` when the matrix
      # starts, and this job resolves it again after all four have finished.
      #
      # MEASURED, and it deadlocked a release. Run 32495361932: the shards checked out hub
      # `accepted` at 15:02:17 and this job at 15:06:17. Hub PR #979 merged f9a440e5 at
      # 15:04:07, adding test/docs/agent_portrait_extension_docs_test.rb and
      # test/lib/agent_avatar_generator_test.rb. bin/rails-executed-set-check then audited
      # 482 committed files against receipts written over 480 and reported the two
      # newcomers as files that "executed NOTHING". Both had run green in the hub's own
      # lane on the same branch minutes earlier; they had not failed to run, they had not
      # yet EXISTED. The receipts' union was byte-identical to the lane's file set at
      # f9a440e5^. A false coverage hole reads exactly like a true one, so the lane went
      # red on every engine PR based on `accepted` until someone read the receipts by hand.
      #
      # Each receipt names the commit its shard ran (the hub's
      # test/minitest/ci_receipt_plugin.rb writes it). Standing this checkout on that
      # commit is what makes the comparison honest — the expected set and the executed set
      # then describe ONE tree instead of two.
      #
      # IT FAILS OPEN IN THE TWO CASES THAT ARE NOT THIS BUG, and neither goes quietly
      # green: the hub's gate owns every verdict either way.
      #   · Receipts naming NO commit — a hub older than the field. Audit the tip exactly
      #     as this lane always did.
      #   · Receipts DISAGREEING with each other — shards that straddled a merge. Leave the
      #     tip alone; their union is a set no single tree ever held, and the hub's gate
      #     refuses it by name rather than letting this step pick a winner.
      - name: Stand this checkout on the commit the shards actually ran
        run: |
          set -euo pipefail

          commit="$(ruby -rjson -e '
            shas = Dir.glob("rails-reports/**/*.json").filter_map do |f|
              (JSON.parse(File.read(f))["commit"].to_s.strip rescue nil)
            end.reject(&:empty?).uniq
            print(shas.length == 1 ? shas.first : "")
          ')"

          if [ -z "${commit}" ]; then
            echo "::notice::the receipts name no single commit — auditing the branch tip, as before"
            exit 0
          fi

          if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
            echo "::warning::the receipts name ${commit}, which this checkout does not contain — auditing the branch tip"
            exit 0
          fi

          echo "shards ran ${commit}; branch tip is $(git rev-parse HEAD) — auditing at the shards' commit"
          git checkout --force --detach "${commit}"

      # FILE COVERAGE IS THIS LANE'S QUESTION; THE SKIP CEILING IS THE HUB'S.
      #
      # bin/rails-executed-set-check asserts two things: that every committed test file
      # executed, and that runtime skips stay under `max_skips` in the hub's contract. The
      # first is exactly what this lane needs. The second is the hub's own hygiene
      # invariant, enforced in the hub's own CI — and it does not survive the trip.
      #
      # MEASURED on the first green sharded run: this lane reports 12 skips where the hub's
      # own CI reports 11, and the extra one is a single test in
      # test/lib/agent_worktree_test.rb. That is not drift; it is the ENVIRONMENT. Here the
      # engine is a path gem with its migrations installed and migrated in, which is the
      # whole point of the lane and is not the tree the hub's ceiling was measured against.
      #
      # Enforcing a ceiling from one environment against a different one produces a FALSE
      # RED, and this ecosystem has already written down what those cost: "a false refusal
      # wedges the release lane far more often than the runs it saves" (ci.yml, on why there
      # is no concurrency group). So the ceiling is dropped for THIS lane only, in the open,
      # with the measurement attached — and the file-coverage assertion, which is what an
      # engine PR actually needs to know, keeps its full strength.
      - name: Assert the lane executed exactly the files it claims to
        run: |
          ruby -ryaml -e 'c = YAML.safe_load_file("config/rails_lane.yml"); c.delete("max_skips"); File.write("consumer-lane.yml", c.to_yaml)'
          bin/rails-executed-set-check rails-reports --contract consumer-lane.yml

