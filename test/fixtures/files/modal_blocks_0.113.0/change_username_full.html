<div x-data="levelingActionModal({
       hasInput: true,
       initialValue: 'pat',
       minLength: 3,
       submitUrl: '/u',
       finalizeUrl: '/f',
       finalizeHook: '',
       savedEvent: 'saved',
       store: 'modals',

        <button type="button" @click="$store.modals.close()"

                aria-label="Close">&times;</button>
    </div>

  
          <p class="text-sm text-muted mb-4">Yours.</p>

        <template x-if="error">
          <p role="alert" class="text-red-400 text-sm mb-3" x-text="error"></p>
        </template>

        <form @submit.prevent="save()" class="space-y-4">
            <input type="text" x-model="value" class="input-field w-full"
                   placeholder="username"
                   minlength="3"
                   maxlength="30"
                   pattern="[a-zA-Z0-9_-]+"
                   title="3-30 characters — letters, numbers, hyphens, and underscores"
                   autofocus>
          <button type="submit" class="btn btn-primary btn-lg w-full" :disabled="saving || !changed">
            <span x-show="!saving" x-text="changed ? 'Save' : 'Saved'">Save</span>
            <span x-show="saving" class="inline-flex items-center justify-center gap-2" style="display: none;">
              <span class="spinner" aria-hidden="true" style="--spinner-track: currentColor; --spinner-color: transparent; opacity: 0.85"></span>
              <span x-text="progressLabel || 'Saving…'">Saving…</span>
            </span>
          </button>
        </form>

</div>
    </div>
  </template>

</div>


      <div class="mb-5">
        <div x-data="{
       displaySeeds: 0,
       displayLevel: 1,
       levelingUp: false,
       showFreeEntryBadge: false,
       _timers: [],
       init() {
         var self = this;
         var perLevel = 100;
         var total = (seedsTotal) || 0;
         var earned = (seedsEarned) || 0;
         var oldSeeds = Math.max(0, total - earned);
         var oldLevel = Math.floor(oldSeeds / perLevel) + 1;
         var newLevel = Math.floor(total / perLevel) + 1;
         var oldToward = oldSeeds % perLevel;
         var newToward = total % perLevel;
         self.displaySeeds = oldToward;
         self.displayLevel = oldLevel;
         var schedule = function (fn, ms) { self._timers.push(setTimeout(fn, ms)); };
         schedule(function () {
           if (newLevel > oldLevel) {
             self.levelingUp = true;
             self.displaySeeds = perLevel;
             schedule(function () {
               self.displayLevel = newLevel;
               self.showFreeEntryBadge = true;
             }, 1900);
             schedule(function () { self.displaySeeds = 0; }, 3400);
             schedule(function () {
               self.displaySeeds = newToward;
               self.levelingUp = false;
             }, 3600);
           } else {
             self.displaySeeds = newToward;
           }
         }, 2000);
       },
       destroy() {
         this._timers.forEach(clearTimeout);
         this._timers = [];
       }
     }"
     class="mx-auto mb-1" style="max-width: 100%;">
